<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode e Light Mode</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#ffffff;
            color:#222222;
            transition:0.3s;
            padding:20px;
        }

        header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        button{
            padding:10px 20px;
            cursor:pointer;
        }

        .card{
            background:#f5f5f5;
            border:1px solid #dddddd;
            padding:20px;
            border-radius:10px;
        }

        /* TEMA ESCURO */

        .dark{
            background:#121212;
            color:white;
        }

        .dark .card{
            background:#1e1e1e;
            border-color:#444444;
        }

        .dark button{
            background:#333333;
            color:white;
            border:1px solid #555555;
        }

    </style>

</head>

<body>

    <header>
        <h1>Exemplo Dark Mode</h1>

        <button onclick="alternarTema()">
            Alternar Tema
        </button>
    </header>

    <div class="card">
        <h2>Meu Card</h2>
        <p>
            Este é um exemplo simples de Light Mode e Dark Mode.
        </p>
    </div>

    <script>

        function alternarTema()
        {
            document.body.classList.toggle("dark");
        }

    </script>

</body>

</html>
